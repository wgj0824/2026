<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>2026 跨年延迟版 wgj</title>
    <style>
        :root {
            --pink: #FFB6C1;
        }
        * { -webkit-tap-highlight-color: transparent; }
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background-color: #030001; overflow: hidden;
            font-family: -apple-system, "PingFang SC", "STKaiti", serif;
        }
        canvas { 
            display: block; width: 100%; height: 100dvh; 
        }

        /* 覆盖层：确保在所有内容之上 */
        #ui-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            width: 100%; height: 100%;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            background: #030001; /* 纯黑背景防止穿透 */
            z-index: 9999; /* 极高层级 */
            transition: opacity 0.6s ease;
        }

        /* 醒目的全屏/启动按钮 */
        #start-btn {
            position: relative;
            padding: 18px 45px;
            font-size: 22px;
            font-weight: 300;
            color: var(--pink);
            background: transparent;
            border: 1.5px solid var(--pink);
            border-radius: 40px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 182, 193, 0.2);
            -webkit-appearance: none; /* 清除iOS默认样式 */
        }

        #start-btn:active {
            transform: scale(0.92);
            background: rgba(255, 182, 193, 0.1);
        }

        #hint-text {
            color: #F8C3CD;
            margin-top: 25px;
            font-size: 14px;
            letter-spacing: 1px;
            opacity: 0.8;
            text-align: center;
        }

        .hidden { 
            opacity: 0 !important; 
            pointer-events: none; 
        }
    </style>
</head>
<body>

    <!-- 启动层 -->
    <div id="ui-overlay">
        <button id="start-btn">点击开启全屏体验</button>
        <div id="hint-text">2026 · 粉黛流芳</div>
    </div>

    <canvas id="canvas"></canvas>

<script>
/**
 * 2026 跨年粒子特效 - iOS Safari 深度优化版
 */
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d', { alpha: false });
const overlay = document.getElementById('ui-overlay');
const startBtn = document.getElementById('start-btn');

let width, height, dpr;
let particles = [];
let fireworks = [];
let sparks = [];
let animationActive = false;

const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

// 粒子配置
const CONFIG = {
    particleCount: isMobile ? 2200 : 5000, 
    particleSize: 1.8,
    focalLength: 400,
    pinkPalette: ['#FFB6C1', '#FFC0CB', '#FFE4E1', '#FFF0F5', '#F8C3CD', '#FFFFFF'],
    fireworkChance: 0.05,
    gravity: 0.12,
    friction: 0.96,
};

function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width * dpr;
    canvas.height = height * dpr;
    ctx.scale(dpr, dpr);
}

window.addEventListener('resize', resize);
resize();

// 文字离屏采样
function getTextPoints(text, sizeScale) {
    const tCanvas = document.createElement('canvas');
    const tCtx = tCanvas.getContext('2d');
    const fSize = Math.min(width * 0.25, height * 0.15) * sizeScale;
    
    tCanvas.width = width;
    tCanvas.height = height;
    tCtx.textAlign = 'center';
    tCtx.textBaseline = 'middle';
    // 适配 iOS 字体
    tCtx.font = `bold ${fSize}px "PingFang SC", "STKaiti", "Kaiti SC", "KaiTi", serif`; 
    tCtx.fillStyle = '#fff';
    tCtx.fillText(text, width / 2, height / 2);

    const data = tCtx.getImageData(0, 0, width, height).data;
    const pts = [];
    const step = isMobile ? 3 : 2; 

    for (let y = 0; y < height; y += step) {
        for (let x = 0; x < width; x += step) {
            if (data[(y * width + x) * 4 + 3] > 128) {
                pts.push({
                    x: x - width / 2,
                    y: y - height / 2,
                    c: CONFIG.pinkPalette[Math.floor(Math.random() * CONFIG.pinkPalette.length)]
                });
            }
        }
    }
    return pts.sort(() => Math.random() - 0.5).slice(0, CONFIG.particleCount);
}

class Particle {
    constructor() {
        this.x = (Math.random() - 0.5) * width;
        this.y = (Math.random() - 0.5) * height;
        this.z = (Math.random() - 0.5) * 500;
        this.tx = this.x; this.ty = this.y; this.tz = this.z;
        this.color = '#fff'; this.alpha = 0; this.tAlpha = 0;
    }
    update() {
        const s = 0.08;
        this.x += (this.tx - this.x) * s;
        this.y += (this.ty - this.y) * s;
        this.z += (this.tz - this.z) * s;
        this.alpha += (this.tAlpha - this.alpha) * 0.1;
    }
    draw() {
        if (this.alpha < 0.05) return;
        const scale = CONFIG.focalLength / (CONFIG.focalLength + this.z);
        ctx.globalAlpha = this.alpha;
        ctx.fillStyle = this.color;
        ctx.fillRect(this.x * scale + width/2, this.y * scale + height/2, CONFIG.particleSize * scale, CONFIG.particleSize * scale);
    }
}

class Firework {
    constructor() {
        this.x = Math.random() * width;
        this.y = height;
        this.targetY = height * 0.1 + Math.random() * height * 0.25;
        this.vx = (Math.random() - 0.5) * 3;
        this.vy = -(isMobile ? 11 : 15) - Math.random() * 5;
        this.hue = Math.random() * 360;
        this.dead = false;
    }
    update() {
        this.x += this.vx; this.y += this.vy;
        this.vy += 0.15;
        if (this.vy >= 0 || this.y <= this.targetY) {
            this.explode();
            this.dead = true;
        }
    }
    draw() {
        ctx.globalAlpha = 1;
        ctx.strokeStyle = `hsl(${this.hue}, 100%, 75%)`;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(this.x, this.y);
        ctx.lineTo(this.x - this.vx, this.y - this.vy);
        ctx.stroke();
    }
    explode() {
        const count = isMobile ? 70 : 150;
        const hue = Math.random() > 0.4 ? this.hue : 330; 
        for (let i = 0; i < count; i++) sparks.push(new Spark(this.x, this.y, hue));
    }
}

class Spark {
    constructor(x, y, h) {
        this.x = x; this.y = y; this.px = x; this.py = y;
        const ang = Math.random() * Math.PI * 2;
        const f = Math.random() * (isMobile ? 8 : 12) + 2;
        this.vx = Math.cos(ang) * f;
        this.vy = Math.sin(ang) * f;
        this.h = h + (Math.random() - 0.5) * 40;
        this.alpha = 1;
        this.decay = 0.01 + Math.random() * 0.015;
    }
    update() {
        this.px = this.x; this.py = this.y;
        this.vx *= CONFIG.friction; this.vy *= CONFIG.friction;
        this.vy += 0.1;
        this.x += this.vx; this.y += this.vy;
        this.alpha -= this.decay;
    }
    draw() {
        if (this.alpha <= 0) return;
        ctx.globalAlpha = this.alpha;
        ctx.strokeStyle = `hsl(${this.h}, 100%, 70%)`;
        ctx.lineWidth = this.alpha * 2.5;
        ctx.beginPath();
        ctx.moveTo(this.px, this.py);
        ctx.lineTo(this.x, this.y);
        ctx.stroke();
    }
}

// 核心控制
for (let i = 0; i < CONFIG.particleCount; i++) particles.push(new Particle());

function morph(txt, size) {
    const pts = txt ? getTextPoints(txt, size) : [];
    for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        if (i < pts.length) {
            p.tx = pts[i].x; p.ty = pts[i].y; p.tz = (Math.random()-0.5)*20;
            p.color = pts[i].c; p.tAlpha = 1;
        } else {
            const a = Math.random() * Math.PI * 2;
            p.tx = Math.cos(a) * width; p.ty = Math.sin(a) * height; p.tAlpha = 0;
        }
    }
}

function launch(n) {
    for(let i=0; i<n; i++) setTimeout(() => fireworks.push(new Firework()), i * 150);
}

function startTimeline() {
    let count = 10;
    const timer = setInterval(() => {
        if(count >= 1) {
            morph(count.toString(), 2.2);
            if(count <= 3) launch(1);
        } else {
            clearInterval(timer);
            morph("2026", 1.8); launch(3);
            setTimeout(() => { morph("新年快乐", 1.3); launch(3); }, 3500);
            setTimeout(() => { morph("祝我们都如愿", 1.3); launch(4); }, 7000);
            setTimeout(() => {
                morph("", 0);
                CONFIG.fireworkChance = isMobile ? 0.2 : 0.35;
                const loop = setInterval(() => launch(isMobile ? 2 : 4), 1600);
                setTimeout(() => { clearInterval(loop); CONFIG.fireworkChance = 0; }, 6000);
            }, 10500);
        }
        count--;
    }, 1000);
}

function animate() {
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 0.18;
    ctx.fillStyle = '#030001';
    ctx.fillRect(0, 0, width, height);

    ctx.globalCompositeOperation = 'lighter';
    if(animationActive && Math.random() < CONFIG.fireworkChance) fireworks.push(new Firework());

    for (let i = fireworks.length - 1; i >= 0; i--) {
        fireworks[i].update(); fireworks[i].draw();
        if (fireworks[i].dead) fireworks.splice(i, 1);
    }
    for (let i = sparks.length - 1; i >= 0; i--) {
        sparks[i].update(); sparks[i].draw();
        if (sparks[i].alpha <= 0) sparks.splice(i, 1);
    }

    ctx.globalCompositeOperation = 'source-over';
    for (let i = 0; i < particles.length; i++) {
        particles[i].update(); particles[i].draw();
    }
    requestAnimationFrame(animate);
}

// 启动监听
startBtn.addEventListener('click', (e) => {
    e.preventDefault();
    e.stopPropagation();
    
    // 尝试进入全屏（针对 iPad/Android）
    if (canvas.requestFullscreen) canvas.requestFullscreen();
    else if (canvas.webkitRequestFullscreen) canvas.webkitRequestFullscreen();

    overlay.classList.add('hidden');
    animationActive = true;
    
    // 延迟一点启动，让 iOS 状态栏收起
    setTimeout(() => {
        resize();
        startTimeline();
    }, 300);
}, { once: true });

animate();
</script>
</body>
</html>
